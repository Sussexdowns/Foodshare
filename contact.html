<!DOCTYPE html>
<html lang="en">

<head>
  <title>Contact Us</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://code.jquery.com https://cdn.jsdelivr.net https://kit.fontawesome.com https://www.gstatic.com 'unsafe-inline';
    style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline';
    font-src 'self' https://cdnjs.cloudflare.com https://kit.fontawesome.com https://ka-f.fontawesome.com https://fonts.gstatic.com;
    img-src 'self' data:;
    connect-src 'self' https://docs.google.com https://ka-f.fontawesome.com https://cdn.jsdelivr.net https://www.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebaseio.com https://foodshare-50695.firebaseapp.com;
    form-action 'self' https://docs.google.com;
  ">

  <!-- CSS & Icons -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/f90ec7d4eb.js" crossorigin="anonymous"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

  <style>
    body {
      font-family: 'Raleway', sans-serif;
    }

    /* Custom validation feedback styles */
    .was-validated .form-control:invalid,
    .was-validated .form-control:valid {
      background-position: right calc(0.375em + 0.1875rem) center;
    }
  </style>

  <!-- Favicons & Manifest -->
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Foodshare" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#2e7d32" />
</head>

<body class="p-4">

  <!-- Header placeholder - loaded via JavaScript -->
  <div id="header-placeholder" class="fixed-top"></div>

  <!-- Begin page content -->
  <main class="flex-shrink-0">

    <!-- Page Heading -->
    <div class="container my-4 text-center">
      <h1 class="d-flex align-items-center justify-content-center">
        <img src="assets/logo.png" alt="Logo" class="logo" />
        Contact Us
      </h1>
    </div>

    <div class="container mb-4">
      <div class="form-section">
        <div id="contact-alert" class="alert alert-info d-none"></div>

        <!-- Google Forms Contact Form with Bootstrap Validation -->
        <form id="contact-form" class="card p-4 shadow-sm border-0 needs-validation"
          action="https://docs.google.com/forms/d/e/1FAIpQLSeP0P8rpROjIDR7myzFO4NpwzgEBGdfmd-AbSGR6Mkg6GK23Q/formResponse"
          method="POST" target="_blank" novalidate>
          <input type="hidden" name="fbzx" id="fbzx" value="-123456789">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="entry.2107060613" class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" id="entry.2107060613" name="entry.2107060613" class="form-control" required
                minlength="2" maxlength="100">
              <div class="valid-feedback">Looks good!</div>
              <div class="invalid-feedback">Please enter your name (at least 2 characters).</div>
            </div>
            <div class="col-md-6">
              <label for="entry.413525859" class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" id="entry.413525859" name="entry.413525859" class="form-control" required
                placeholder="you@example.com">
              <div class="valid-feedback">Looks good!</div>
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
            <div class="col-12">
              <label for="entry.1834693471" class="form-label">Message <span class="text-danger">*</span></label>
              <textarea id="entry.1834693471" name="entry.1834693471" class="form-control" rows="5" required
                minlength="10" maxlength="2000" placeholder="How can we help you?"></textarea>
              <div class="valid-feedback">Looks good!</div>
              <div class="invalid-feedback">Please enter your message (at least 10 characters).</div>
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="button" class="btn btn-outline-primary" id="contact-signin">
                <i class="fab fa-google"></i> Sign in with Google
              </button>
              <button type="submit" class="btn btn-primary" id="submit-btn" style="display: none;">Send Message</button>
              <button type="reset" class="btn btn-outline-secondary">Reset</button>
            </div>
          </div>
        </form>
      </div>
    </div>

  </main>

  <!-- Settings Modal - loaded dynamically -->
  <div id="settingsModal" class="modal hidden">
    <!-- Content loaded from settings_modal.html -->

  </div>

  <!-- Footer placeholder - loaded via JavaScript -->
  <div id="footer-placeholder" class="fixed-bottom"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <!-- Firebase config first -->
  <script src="config.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="scripts/sanitize.js"></script>

  <script src="scripts/base.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const contactForm = document.getElementById('contact-form');
      const submitBtn = document.getElementById('submit-btn');
      const signinBtn = document.getElementById('contact-signin');
      const alertDiv = document.getElementById('contact-alert');

      // Check auth state on page load and show appropriate button
      function updateAuthButtons() {
        if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0) {
          if (isUserAuthenticated()) {
            signinBtn.style.display = 'none';
            submitBtn.style.display = 'inline-block';
          } else {
            signinBtn.style.display = 'inline-block';
            submitBtn.style.display = 'none';
          }
        }
      }

      // Auth state observer - only after Firebase is initialized
      if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0 && firebase.auth) {
        firebase.auth().onAuthStateChanged(function () {
          updateAuthButtons();
        });
      }

      // Initial check after a delay for Firebase to initialize
      setTimeout(updateAuthButtons, 1000);

      // Sign-in button handler
      if (signinBtn) {
        signinBtn.addEventListener('click', async function () {
          const signedIn = await signInWithGoogle();
          if (signedIn) {
            signinBtn.style.display = 'none';
            submitBtn.style.display = 'inline-block';
          }
        });
      }

      if (contactForm) {
        // Bootstrap 5 validation
        contactForm.addEventListener('submit', async function (event) {
          // Check form validity
          if (!contactForm.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
            contactForm.classList.add('was-validated');

            // Show validation errors in alert panel
            const invalidFields = [];
            contactForm.querySelectorAll(':invalid').forEach(field => {
              const label = contactForm.querySelector(`label[for="${field.id}"]`);
              invalidFields.push(label ? label.textContent.replace('*', '').trim() : field.name);
            });
            alertDiv.classList.remove('d-none');
            alertDiv.className = 'alert alert-danger';
            alertDiv.innerHTML = '<strong>Please fix the following fields:</strong><ul class="mb-0">' +
              invalidFields.map(f => `<li>${f}</li>`).join('') + '</ul>';
            return;
          } else {
            // Form is valid, require Google authentication
            event.preventDefault();

            // Ensure user is signed in with Google
            if (!isUserAuthenticated()) {
              alert('Please sign in with Google to send a message.');
              const signedIn = await signInWithGoogle();
              if (!signedIn) return;
            }

            // Verify provider (defense in depth)
            const user = firebase.auth().currentUser;
            if (!user || !user.providerData.some(p => p.providerId === 'google.com')) {
              alert('Please sign in with Google to send a message.');
              const signedIn = await signInWithGoogle();
              if (!signedIn) return;
            }

            // Sanitize inputs before submission
            const nameInput = document.getElementById('entry.2107060613');
            const emailInput = document.getElementById('entry.413525859');
            const messageInput = document.getElementById('entry.1834693471');

            // Basic length checks
            if (nameInput.value.trim().length < 2 || nameInput.value.length > 100) {
              alert('Name must be 2-100 characters');
              return;
            }
            if (messageInput.value.trim().length < 10 || messageInput.value.length > 2000) {
              alert('Message must be 10-2000 characters');
              return;
            }

            // Strip HTML tags from text inputs
            nameInput.value = SecurityUtils.sanitizeHtml(nameInput.value).substring(0, 100);
            messageInput.value = SecurityUtils.sanitizeHtml(messageInput.value).substring(0, 2000);

            // Show submitting message
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Sending...';

            // Create form data
            const formData = new FormData(contactForm);

            // Submit using fetch with no-cors mode for Google Forms
            fetch(contactForm.action, {
              method: 'POST',
              mode: 'no-cors',
              body: formData
            })
              .then(function () {
                // Hide the form
                contactForm.closest('.form-section').style.display = 'none';
                // Show success message
                alertDiv.classList.remove('d-none');
                alertDiv.className = 'alert alert-success';
                alertDiv.innerHTML = '<strong>Thank you!</strong> Your message has been sent successfully.';
              })
              .catch(function (error) {
                // Even on error, Google Forms may have received the submission
                contactForm.closest('.form-section').style.display = 'none';
                alertDiv.classList.remove('d-none');
                alertDiv.className = 'alert alert-success';
                alertDiv.innerHTML = '<strong>Thank you!</strong> Your message has been sent.';
              })
          }

          // Add validation class for styling
          contactForm.classList.add('was-validated');
        });

        // Real-time validation feedback
        const inputs = contactForm.querySelectorAll('.form-control');
        inputs.forEach(function (input) {
          input.addEventListener('input', function () {
            if (this.checkValidity()) {
              this.classList.add('is-valid');
              this.classList.remove('is-invalid');
            } else {
              this.classList.add('is-invalid');
              this.classList.remove('is-valid');
            }
          });

          input.addEventListener('blur', function () {
            if (this.checkValidity()) {
              this.classList.add('is-valid');
              this.classList.remove('is-invalid');
            } else if (this.value.length > 0) {
              this.classList.add('is-invalid');
              this.classList.remove('is-valid');
            }
          });
        });
      }
    });
  </script>

</body>

</html>
